# Lives in /srv/rokomet-stats on the server; the deploy job copies it there (specs/infrastructure.md).
name: rokomet-stats

services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: ghcr.io/grega-rotar/rokomet-stats:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      CLAUDE_POOL_SERVER_ID: t4a
      # Chat Claude may only read the stats (scripts/chat-CLAUDE.md); this overrides .env.
      CLAUDE_ALLOWED_TOOLS: "Bash(python3 /app/scripts/query.py:*),Bash(python3 /app/scripts/players.py:*)"
      # Bash is the only tool that exists; --allowedTools above limits it to the two read-only scripts.
      CLAUDE_TOOLS: Bash
      CLAUDE_PROMPT_FILE: /app/scripts/chat-CLAUDE.md
    volumes:
      - app_data:/data
      - claude_home:/home/app/.claude
      - ./claude-pool:/home/app/.config/claude-pool:ro

  # Fills /data/stats.db from the RZS API (specs/stats-pipeline.md). Same image as app.
  crawler:
    image: ghcr.io/grega-rotar/rokomet-stats:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["sh", "/app/scripts/crawler-loop.sh"]
    healthcheck:
      disable: true
    environment:
      CRAWL_INTERVAL_SECONDS: 21600
      CRAWL_SHARDS: 3
      CRAWL_HISTORY: all  # every past season once, newest first (about 15-20 h the first time)
      # After each crawl: scripts/review.py explains failed checks (AI only where no rule fits) and audits a sample
      # once a week. Same claude-pool accounts and usage state (/data/claude-pool-state.json) as the app.
      CLAUDE_POOL_SERVER_ID: t4a
      REVIEW_MAX_RUNS: 20
      AUDIT_SAMPLE: 10
    volumes:
      - app_data:/data
      - ./claude-pool:/home/app/.config/claude-pool:ro

volumes:
  caddy_data:
  caddy_config:
  app_data:
  claude_home:
